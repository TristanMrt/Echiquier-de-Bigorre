    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        if (!sessionStorage.getItem('admin_connecte')) {
            window.location.href = '../login.html';
        }

        let messages = [];

        async function chargerMessages() {
            try {
                const res = await fetch('../admin/load.php?fichier=messages');
                const data = await res.json();
                if (Array.isArray(data)) messages = data;
            } catch (error) {}
            renderMessages();
        }

        function renderMessages() {
            const container = document.getElementById('messages-container');
            if (messages.length === 0) {
                container.innerHTML = '<p class="text-custom-white text-center fs-5">Aucun message pour le moment.</p>';
                return;
            }
            container.innerHTML = '';
            messages.forEach((msg, index) => {
                const div = document.createElement('div');
                div.className = 'admin-section-row p-3 d-flex flex-column gap-2';
                div.style.gridTemplateColumns = '1fr';
                div.innerHTML = `
                    <div class="d-flex justify-content-between align-items-start">
                        <div class="d-flex flex-column gap-1">
                            <span class="text-custom-white fs-6 inter-bold">${msg.prenom} ${msg.nom}</span>
                            <span class="text-custom-or fs-6">${msg.email}</span>
                            <span class="text-custom-white fs-6 fst-italic">${msg.date}</span>
                        </div>
                        <button class="btn-delete fs-5" onclick="supprimerMessage(${index})">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                    <p class="text-custom-white fs-6 mb-0 mt-2">${msg.message}</p>
                `;
                container.appendChild(div);
            });
        }

        async function supprimerMessage(index) {
            if (!confirm('Supprimer ce message ?')) return;
            messages.splice(index, 1);
            const formData = new FormData();
            formData.append('fichier', 'messages');
            formData.append('donnees', JSON.stringify(messages));
            try {
                await fetch('../admin/save.php', { method: 'POST', body: formData });
                renderMessages();
            } catch (error) {
                alert('Erreur lors de la suppression.');
            }
        }

        chargerMessages();
    </script>
